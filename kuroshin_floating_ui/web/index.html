<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuroshin</title>
  <link rel="stylesheet" href="style.css"/>
  <!-- QWebChannel koprusu — pywebview.api shimini saglar -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
  (function() {
    function initChannel() {
      if (typeof QWebChannel === 'undefined' || typeof qt === 'undefined') {
        setTimeout(initChannel, 50);
        return;
      }
      new QWebChannel(qt.webChannelTransport, function(channel) {
        var _a = channel.objects.api;
        window.pywebview = {
          api: {
            move_window:        function(x,y)   { _a.move_window(x,y); },
            toggle_panel:       function(s)     { _a.toggle_panel(s); },
            save_position:      function(x,y,c) { _a.save_position(x,y,c); },
            quit:               function()      { _a.quit(); },
            get_settings:       function()      { return new Promise(function(r){ _a.get_settings(r); }); },
            get_status:         function()      { return new Promise(function(r){ _a.get_status(r); }); },
            send_message:       function(t)     { return new Promise(function(r){ _a.send_message(t,r); }); },
            ram_purge:          function()      { _a.ram_purge(); },
            llm_toggle:         function()      { _a.llm_toggle(); },
            chancellor_restart: function()      { _a.chancellor_restart(); },
            show_alarms:        function()      { _a.show_alarms(); },
            set_auto_open:      function(v)     { _a.set_auto_open(v); },
            get_hw_stats:       function()      { return new Promise(function(r){ _a.get_hw_stats(r); }); },
          }
        };
        window.dispatchEvent(new Event('pywebviewready'));
      });
    }
    initChannel();
  })();
  </script>
</head>
<body>

<div id="ui-root">

  <!-- ── Chat Panel ── -->
  <div id="chat-panel" class="collapsed">

    <!-- Status Bar -->
    <div class="status-bar">
      <div style="display:flex;gap:8px;align-items:center;font-size:10px;color:#A3A3A3;">
        <span style="display:flex;align-items:center;gap:3px;">
          CH<span id="led-ch" class="led-dot led-unknown">●</span>
        </span>
        <span style="display:flex;align-items:center;gap:3px;">
          L1<span id="led-lm" class="led-dot led-unknown">●</span>
        </span>
        <span style="display:flex;align-items:center;gap:3px;">
          L2<span id="led-lm2" class="led-dot led-unknown">●</span>
        </span>
        <span style="display:flex;align-items:center;gap:3px;">
          WK<span id="led-wk" class="led-dot led-unknown">●</span>
        </span>
      </div>
      <span id="mode-badge" style="font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1px;">LITE</span>
      <button id="close-btn"
        style="background:none;border:none;color:#A3A3A3;cursor:pointer;font-size:13px;
               padding:2px 4px;transition:color 0.2s;"
        onmouseover="this.style.color='#fff'"
        onmouseout="this.style.color='#A3A3A3'">✕</button>
    </div>

    <!-- Hardware Monitor Bar -->
    <div class="hw-bar">
      <span class="hw-item">CPU <span id="hw-cpu-val" class="hw-val">--</span></span>
      <span class="hw-sep">·</span>
      <span class="hw-item">RAM <span id="hw-ram-val" class="hw-val">--</span></span>
      <span class="hw-sep">·</span>
      <span class="hw-item">GPU <span id="hw-gpu-val" class="hw-val">--</span></span>
    </div>

    <!-- Chat Area -->
    <div id="chat-area"></div>

    <!-- Input Area -->
    <div class="input-area">
      <span class="input-prompt">&gt;</span>
      <input id="cmd-input" type="text" placeholder="komut gir..." autocomplete="off" spellcheck="false"/>
      <button id="send-btn">▶</button>
    </div>

    <!-- Sistem Butonları -->
    <div class="sys-buttons">
      <button class="sys-btn" id="btn-ram" title="Bellek Temizle">
        <img src="../assets/icons/cpu.svg" alt=""/>
        <span class="btn-label">Bellek</span>
      </button>
      <button class="sys-btn" id="btn-llm" title="Model Aç/Kapat">
        <img src="../assets/icons/cpu-fix.svg" alt=""/>
        <span class="btn-label">Model</span>
      </button>
      <button class="sys-btn" id="btn-restart" title="Yeniden Başlat">
        <img src="../assets/icons/arrow-clockwise.svg" alt=""/>
        <span class="btn-label">Yenile</span>
      </button>
      <button class="sys-btn" id="btn-alarm" title="Fiyat Alarmları">
        <img src="../assets/icons/bell.svg" alt=""/>
        <span class="btn-label">Alarm</span>
      </button>
      <button class="sys-btn" id="btn-autoopen" title="Başlangıçta Paneli Otomatik Aç">
        <span id="autoopen-icon" style="font-size:16px;line-height:1;color:#444;transition:color 0.3s;">⏻</span>
        <span class="btn-label" id="autoopen-label">Başlangıç</span>
      </button>
    </div>

  </div><!-- /chat-panel -->

  <!-- ── Floating Orb ── -->
  <div id="orb-btn">
    <canvas id="webgl-orb"></canvas>
    <div id="orb-fallback"></div>
  </div>


</div><!-- /ui-root -->

<script src="audio.js"></script>
<script src="orb.js"></script>
<script src="chat.js"></script>
<script src="app.js"></script>
</body>
</html>
